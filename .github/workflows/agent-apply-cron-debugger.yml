name: diagnose operator cron debugger source

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'agent/cron-admin-debugger'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/cron-admin-debugger
          show-progress: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - name: Capture applicator output
        shell: bash
        run: |
          set +e
          python3 scripts/apply-cron-debugger.py > /tmp/admin-cron-apply.log 2>&1
          apply_status=$?
          if [ "$apply_status" -eq 0 ]; then
            cargo fmt --all >> /tmp/admin-cron-apply.log 2>&1
            fmt_status=$?
          else
            fmt_status=1
          fi
          printf 'apply=%s\nfmt=%s\n' "$apply_status" "$fmt_status" > /tmp/admin-cron-apply.status
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: admin-cron-apply-${{ github.run_id }}
          path: |
            /tmp/admin-cron-apply.log
            /tmp/admin-cron-apply.status
          if-no-files-found: error
