[package]
name = "fiducia-admin"
version = "0.1.0"
edition = "2021"
description = "Admin app for fiducia.cloud — server-rendered HTML dashboard for accounts/API keys (via fiducia-auth) and infra ops (via fiducia-brain)."

[dependencies]
# `ws` powers the admin-plane /admin/ws sync broadcast (P2).
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["trace", "timeout", "limit", "catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# HTTP client for calling fiducia-auth (sessions/keys) and fiducia-brain (infra).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Compile-checked, auto-escaping HTML templates (the MASH "M"). Replaces the
# hand-rolled string templates + esc() in views.rs; the axum feature makes
# Markup an IntoResponse.
maud = { version = "0.26", features = ["axum"] }

# Shared OpenTelemetry + tracing setup (one init() for all services).
fiducia-telemetry = { git = "https://github.com/fiducia-cloud/fiducia-telemetry.rs", tag = "v0.1.0" }

# Shared API payload/error contract (generated from fiducia-interfaces schemas) —
# the one source of truth for the types every fiducia service speaks.
fiducia-interfaces = { path = "../fiducia-interfaces/generated/rust" }

# Generated sqlx::FromRow row types for the ADMIN Postgres plane (its OWN DB, a
# security boundary — never the customer DB). The infra_operations vertical
# reads/writes these when DATABASE_URL is set.
fiducia-interfaces-db = { path = "../fiducia-interfaces/generated/rust-db" }

# The local-first sync protocol core (native build, no wasm). The admin server
# builds its fiducia:sync change frames and write-acks from THESE types so it and
# the @fiducia/sync browser client share one protocol definition (same as customer).
fiducia-sync-core = { path = "../fiducia-sync" }

# SQLx for the DB-backed infra_operations handlers (P2). Runtime-checked queries
# (query_as, not the compile-time macros) so `cargo build` needs no live DB.
sqlx = { version = "0.8", features = [
    "postgres",
    "runtime-tokio-rustls",
    "uuid",
    "chrono",
    "json",
    "macros",
] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
# `ServiceExt::oneshot` drives the router in tests without binding a socket.
tower = { version = "0.5", features = ["util"] }
