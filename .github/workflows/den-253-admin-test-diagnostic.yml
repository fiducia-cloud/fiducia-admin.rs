name: DEN-253 one-shot cluster auth fixture migration

on:
  push:
    branches:
      - agent/den-253-require-admin-authorization-context
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: den-253-admin-test-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate-cluster-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
          ref: agent/den-253-require-admin-authorization-context
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - name: Migrate only the legacy cluster auth fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/den-253-migrate-cluster-fixtures.py
          rustfmt --edition 2021 src/cluster_tests.rs
          if git diff --quiet -- src/cluster_tests.rs; then
            echo 'no fixture migration required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/cluster_tests.rs
          git commit -m 'DEN-253 migrate cluster auth test fixtures'
          git push origin HEAD:agent/den-253-require-admin-authorization-context
