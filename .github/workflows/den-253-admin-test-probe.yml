name: DEN-253 one-shot admin auth fixture migration

on:
  push:
    branches:
      - agent/den-253-require-admin-authorization-context
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: den-253-admin-test-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
          ref: agent/den-253-require-admin-authorization-context
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - name: Add the trusted admin context to the legacy auth fixture once
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/auth_flow_tests.rs')
          source = path.read_text()
          marker = '"surface_audiences": ["fiducia-admin"]'
          if marker in source:
              print('admin authorization fixture already migrated')
              raise SystemExit(0)

          old = '''                    "user_id": "00000000-0000-0000-0000-000000000001",
                              "email": "operator@example.com",
                              "orgs": ["org_admin"],
                              "roles": ["operator"]'''
          new = '''                    "user_id": "00000000-0000-0000-0000-000000000001",
                              "email": "operator@example.com",
                              "orgs": ["org_admin"],
                              "roles": ["operator"],
                              "authorization": {
                                  "version": 1,
                                  "surface_audiences": ["fiducia-admin"],
                                  "roles": ["operator"],
                                  "capabilities": ["admin:read", "admin:operate"]
                              }'''
          if source.count(old) != 1:
              raise SystemExit('expected operator auth fixture anchor exactly once')
          path.write_text(source.replace(old, new))
          PY
          rustfmt --edition 2021 src/auth_flow_tests.rs
          if git diff --quiet -- src/auth_flow_tests.rs; then
            echo 'no fixture migration required'
            exit 0
          fi
          if ! git diff --quiet -- . ':(exclude)src/auth_flow_tests.rs'; then
            echo 'fixture migration changed an unexpected path' >&2
            git --no-pager diff -- . ':(exclude)src/auth_flow_tests.rs'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/auth_flow_tests.rs
          git commit -m 'DEN-253 migrate admin auth test fixture'
          git push origin HEAD:agent/den-253-require-admin-authorization-context
