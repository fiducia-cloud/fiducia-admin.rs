# Non-secret command-line configuration for fiducia-admin. Sensitive values stay
# environment-only so they do not leak through process listings or shell history.
[help]
url = "https://github.com/fiducia-cloud/fiducia-admin.rs"
columns = ["options", "env", "type", "description"]

[parse]
allow_unknown = false

[env]
ignore = ["DATABASE_URL", "FIDUCIA_INTERNAL_SECRET", "SUPABASE_URL", "SUPABASE_PUBLISHABLE_KEY", "FIDUCIA_ADMIN_CSRF_SECRET", "FIDUCIA_ADMIN_DEV_SESSION", "OTEL_EXPORTER_OTLP_ENDPOINT"]

[flags.port]
env = "PORT"
aliases = ["port"]
short = "p"
type = "integer"
help = "HTTP listen port."

[flags.auth-url]
env = "FIDUCIA_AUTH_URL"
aliases = ["auth-url"]
type = "string"
help = "Authentication service base URL."

[flags.brain-url]
env = "FIDUCIA_BRAIN_URL"
aliases = ["brain-url"]
type = "string"
help = "Brain service base URL."

[flags.prometheus-url]
env = "FIDUCIA_PROMETHEUS_URL"
aliases = ["prometheus-url"]
type = "string"
help = "Prometheus base URL for the Cluster Insight summary probe (optional)."

[flags.loki-url]
env = "FIDUCIA_LOKI_URL"
aliases = ["loki-url"]
type = "string"
help = "Loki base URL for the Cluster Insight events panel (optional)."

[flags.grafana-public-url]
env = "FIDUCIA_GRAFANA_PUBLIC_URL"
aliases = ["grafana-public-url"]
type = "string"
help = "Public Grafana base URL or path prefix used for Explore deep links (optional)."

[flags.node-urls]
env = "FIDUCIA_NODE_URLS"
aliases = ["node-urls"]
type = "string"
help = "Comma-separated fiducia-node base URLs; overrides brain-based node discovery (optional)."

[flags.node-host-suffix]
env = "FIDUCIA_NODE_HOST_SUFFIX"
aliases = ["node-host-suffix"]
type = "string"
help = "In-cluster DNS suffix a brain-discovered node address must carry (or be loopback) before the observe fan-out dials it with the cluster secret (default .svc.cluster.local)."

[flags.admin-origin]
env = "FIDUCIA_ADMIN_ORIGIN"
aliases = ["admin-origin"]
type = "string"
help = "Exact public admin origin used for Host and CSRF-origin checks."

[flags.insecure-cookies]
env = "FIDUCIA_INSECURE_COOKIES"
aliases = ["insecure-cookies"]
type = "bool"
help = "Allow plain-HTTP cookies in debug builds for local development."

[flags.log]
env = "RUST_LOG"
aliases = ["log"]
type = "string"
help = "Rust tracing filter."
