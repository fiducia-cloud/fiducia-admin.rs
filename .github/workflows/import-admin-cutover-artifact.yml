name: import-admin-cutover-artifact

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [ready_for_review]

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  import:
    if: >-
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.issue.number == 37 &&
        github.event.comment.body == '/import-admin-cutover-artifact-8911286436' &&
        github.event.sender.login == 'ORESoftware' &&
        github.event.sender.id == 11139560
      ) || (
        github.event_name == 'pull_request_target' &&
        github.event.pull_request.number == 37 &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'agent/admin-shared-auth-cutover-v2' &&
        github.event.pull_request.head.sha == '6c78538e49ea23d2b527623ad76b54ecb8a2ccc3' &&
        github.event.sender.login == 'ORESoftware' &&
        github.event.sender.id == 11139560
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: agent/admin-shared-auth-cutover-v2
      EXPECTED_HEAD: 6c78538e49ea23d2b527623ad76b54ecb8a2ccc3
      ARTIFACT_ID: "8911286436"
      ARTIFACT_ZIP_SHA256: c1c9484158bc429ca77088d29ac0fbba2ec2456ca38378ff5a657fd70e73c1c5
      ARTIFACT_TGZ_SHA256: 717832f92d5616e351d5f1b5ebb0f450dde5ce813ee008505272ae5927902545
      MAIN_RS_SHA256: 5b668ad9f79f7171dc23308f55a7a27566a5574371015f6a8f6cc2a05cc3df35
      CARGO_LOCK_SHA256: cf75d6541ce7c823fc96a07b2e9a000d3038791d41be2570466f31b1e405dad8
      INTERFACES_PIN: f64cefd987ed16173c526b33a92fb90cbdfcac45
    steps:
      - name: Verify immutable PR target
        run: |
          set -euo pipefail
          pr_json=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/37")
          test "$(jq -r '.head.repo.full_name' <<<"$pr_json")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.head.ref' <<<"$pr_json")" = "$TARGET_BRANCH"
          test "$(jq -r '.head.sha' <<<"$pr_json")" = "$EXPECTED_HEAD"
          test "$(jq -r '.state' <<<"$pr_json")" = "open"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Download and verify the exact generated artifact
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > artifact.zip
          echo "${ARTIFACT_ZIP_SHA256}  artifact.zip" | sha256sum --check --strict
          unzip -q artifact.zip -d artifact
          echo "${ARTIFACT_TGZ_SHA256}  artifact/admin-cutover-generated.tgz" \
            | sha256sum --check --strict
          mkdir generated
          tar -xzf artifact/admin-cutover-generated.tgz -C generated
          echo "${MAIN_RS_SHA256}  generated/src/main.rs" | sha256sum --check --strict
          echo "${CARGO_LOCK_SHA256}  generated/Cargo.lock" | sha256sum --check --strict

      - name: Import only source-owned files
        run: |
          set -euo pipefail
          cp generated/src/main.rs src/main.rs
          cp generated/Cargo.lock Cargo.lock
          rm -f scripts/generate-admin-cutover.py

          python3 - <<'PY'
          from pathlib import Path

          old_pins = {
              "6081bc3f3b7cbe0312870968b61acc38ca91c66a",
              "0ad257b6708117dcc3643a9fd15b0f92ca394c1f",
          }
          new_pin = "f64cefd987ed16173c526b33a92fb90cbdfcac45"
          paths = [Path("Dockerfile"), Path("dependency-pins.json")]
          for path in paths:
              value = path.read_text()
              for old in old_pins:
                  value = value.replace(old, new_pin)
              if new_pin not in value:
                  raise SystemExit(f"{path}: current interfaces pin is missing")
              if any(old in value for old in old_pins):
                  raise SystemExit(f"{path}: stale interfaces pin remains")
              path.write_text(value)
          PY

          python3 -m json.tool dependency-pins.json >/dev/null
          git diff --check
          if grep -R --line-number --fixed-strings 'FIDUCIA_AUTH_URL' src Cargo.toml; then
            echo 'legacy Fiducia Auth runtime configuration remains' >&2
            exit 1
          fi
          grep -q --fixed-strings 'required_env("SHARED_AUTH_URL")' src/main.rs
          grep -q --fixed-strings 'make_session_cookie(session_upgrade.access_token())' src/main.rs

      - name: Commit only the verified source boundary
        run: |
          set -euo pipefail
          rm -rf artifact artifact.zip generated
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/main.rs \
            Cargo.lock \
            Dockerfile \
            dependency-pins.json \
            scripts/generate-admin-cutover.py
          git diff --cached --check
          git diff --cached --name-only | sort > "${RUNNER_TEMP}/actual-files.txt"
          if grep -q '^\.github/workflows/' "${RUNNER_TEMP}/actual-files.txt"; then
            echo 'workflow files must be updated only through the reviewed GitHub App cleanup phase' >&2
            exit 1
          fi
          for required in Cargo.lock Dockerfile dependency-pins.json scripts/generate-admin-cutover.py src/main.rs; do
            grep -Fxq "$required" "${RUNNER_TEMP}/actual-files.txt"
          done
          git commit -m "feat(auth): import verified admin Shared Auth source"
          git push origin "HEAD:${TARGET_BRANCH}"
