name: DEN-253 one-shot admin authorization decision

on:
  push:
    branches:
      - agent/den-253-require-admin-authorization-context
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: den-253-auth-decision-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate-decision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
          ref: agent/den-253-require-admin-authorization-context
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - name: Preserve authenticated non-admin denial semantics
        shell: bash
        run: |
          set -euo pipefail
          # The workflow exists before this trigger commit, so the branch push runs it.
          python3 .github/scripts/den-253-auth-decision.py
          rustfmt --edition 2021 src/session.rs
          if git diff --quiet -- src/session.rs; then
            echo 'authorization decision already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/session.rs
          git commit -m 'DEN-253 preserve authenticated non-admin denial semantics'
          git push origin HEAD:agent/den-253-require-admin-authorization-context
