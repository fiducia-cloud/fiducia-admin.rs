name: DEN-253 one-shot admin test probe

on:
  push:
    branches:
      - agent/den-253-require-admin-authorization-context
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: den-253-admin-test-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture-test-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
          ref: agent/den-253-require-admin-authorization-context
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - name: Capture final test output once
        shell: bash
        run: |
          set -euo pipefail
          diagnostic=docs/den-253-admin-test-diagnostics.txt
          if [[ -f "$diagnostic" ]]; then
            echo 'diagnostic already captured'
            exit 0
          fi
          set +e
          cargo test --all-targets -- --nocapture > /tmp/test.log 2>&1
          status=$?
          set -e
          tail -n 300 /tmp/test.log > "$diagnostic"
          printf '\nexit_status=%s\n' "$status" >> "$diagnostic"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$diagnostic"
          git commit -m 'DEN-253 capture concise admin test diagnostic'
          git push origin HEAD:agent/den-253-require-admin-authorization-context
