[package]
name = "fiducia-admin"
version = "0.1.0"
edition = "2021"
description = "Operator-only admin app for fiducia.cloud infrastructure operations."

[dependencies]
# `ws` powers the admin-plane /admin/ws sync broadcast (P2).
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
tower-http = { version = "0.5", features = ["trace", "timeout", "limit", "catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# HTTP client for the Supabase password grant and fiducia-brain operations.
# Session verification and the provider race live in fiducia-shared-auth-guard.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Compile-checked, auto-escaping HTML templates (the MASH "M"). Replaces the
# hand-rolled string templates + esc() in views.rs; the axum feature makes
# Markup an IntoResponse.
maud = { version = "0.26", features = ["axum"] }

# Shared OpenTelemetry + tracing setup (one init() for all services).
fiducia-telemetry = { git = "https://github.com/fiducia-cloud/fiducia-telemetry.rs", tag = "v0.2.1" }

# Shared API payload/error contract (generated from fiducia-interfaces schemas) —
# the one source of truth for the types every fiducia service speaks.
fiducia-interfaces = { path = "../fiducia-interfaces/generated/rust" }
# Deployable Shared Auth protocol adapter. This verifies existing Shared Auth
# JWTs locally and races provider exchange against the ADMIN Supabase project;
# it never derives privileged roles from direct provider metadata.
fiducia-shared-auth-guard = { path = "../fiducia-interfaces/adapters/shared-auth-rust" }

# The local-first sync protocol core (native build, no wasm). The admin server
# builds its fiducia:sync change frames and write-acks from THESE types so it and
# the @fiducia/sync browser client share one protocol definition (same as customer).
fiducia-sync-core = { path = "../fiducia-sync" }

# SeaORM owns the isolated admin-plane Postgres connection and all runtime CRUD.
# Entities in src/entity mirror the canonical fiducia-interfaces admin schema.
sea-orm = { version = "1.1", default-features = false, features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-uuid",
    "with-chrono",
    "with-json",
] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
# `ServiceExt::oneshot` drives the router in tests without binding a socket.
tower = { version = "0.5", features = ["util"] }
