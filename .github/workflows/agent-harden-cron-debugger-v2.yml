name: harden cron debugger trust boundary v2

on:
  push:
    branches:
      - agent/cron-admin-debugger

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/cron-admin-debugger
          fetch-depth: 0
          submodules: recursive
          path: repo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-interfaces
          ref: 2c5c806174e067fbe83ad48b724366323ba390a2
          path: fiducia-interfaces
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-sync
          ref: 6de4f016769960023f8e5a7cfb8a989d7fb2b302
          path: fiducia-sync
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - name: Validate trace context and redact schedule destinations
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/cron_debug.rs')
          source = path.read_text()

          def block(lines):
              return "\n".join(lines) + "\n"

          marker = 'const ORG_HEADER: &str = "x-fiducia-org-id";\n'
          if 'const MAX_TRACESTATE_BYTES' not in source:
              source = source.replace(marker, block([
                  'const ORG_HEADER: &str = "x-fiducia-org-id";',
                  'const MAX_TRACESTATE_BYTES: usize = 512;',
              ]), 1)

          marker = 'fn redact_function_value(mut value: Value) -> Value {\n'
          helper_lines = [
              'fn valid_traceparent(value: &HeaderValue) -> bool {',
              '    let Ok(value) = value.to_str() else { return false; };',
              '    let bytes = value.as_bytes();',
              '    if bytes.len() != 55 || &bytes[0..2] != b"00" || bytes[2] != b\'-\' || bytes[35] != b\'-\' || bytes[52] != b\'-\' {',
              '        return false;',
              '    }',
              '    let lower_hex = |byte: &u8| byte.is_ascii_hexdigit() && !byte.is_ascii_uppercase();',
              '    if !bytes[3..35].iter().all(lower_hex) || !bytes[36..52].iter().all(lower_hex) || !bytes[53..55].iter().all(lower_hex) {',
              '        return false;',
              '    }',
              '    bytes[3..35].iter().any(|byte| *byte != b\'0\') && bytes[36..52].iter().any(|byte| *byte != b\'0\')',
              '}',
              '',
              'fn valid_tracestate(value: &HeaderValue) -> bool {',
              '    value.to_str().is_ok_and(|value| !value.is_empty() && value.len() <= MAX_TRACESTATE_BYTES && value.bytes().all(|byte| (0x20..=0x7e).contains(&byte)))',
              '}',
              '',
              'fn insert_valid_trace_context(incoming: &HeaderMap, outgoing: &mut HeaderMap) {',
              '    let traceparent = HeaderName::from_static("traceparent");',
              '    let tracestate = HeaderName::from_static("tracestate");',
              '    let Some(value) = incoming.get(&traceparent).filter(|value| valid_traceparent(value)) else { return; };',
              '    outgoing.insert(traceparent, value.clone());',
              '    if let Some(value) = incoming.get(&tracestate).filter(|value| valid_tracestate(value)) {',
              '        outgoing.insert(tracestate, value.clone());',
              '    }',
              '}',
              '',
              'fn redact_schedule_value(mut value: Value) -> Value {',
              '    fn redact_schedule_object(object: &mut Map<String, Value>) {',
              '        for key in ["headers", "body", "payload", "request", "webhook_url", "grpc_endpoint"] { object.remove(key); }',
              '        let Some(target) = object.get_mut("target").and_then(Value::as_object_mut) else { return; };',
              '        let kind = target.get("kind").or_else(|| target.get("type")).and_then(Value::as_str).unwrap_or("unknown").to_string();',
              '        let function_id = target.get("function_id").or_else(|| target.get("functionId")).cloned();',
              '        target.clear();',
              '        target.insert("kind".to_string(), Value::String(kind.clone()));',
              '        if kind == "function" {',
              '            if let Some(function_id) = function_id { target.insert("function_id".to_string(), function_id); }',
              '        } else {',
              '            target.insert("destination_redacted".to_string(), Value::Bool(true));',
              '        }',
              '    }',
              '    if let Some(object) = value.as_object_mut() {',
              '        if let Some(schedule) = object.get_mut("schedule").and_then(Value::as_object_mut) { redact_schedule_object(schedule); }',
              '        redact_schedule_object(object);',
              '    }',
              '    value',
              '}',
              '',
              'fn redact_function_value(mut value: Value) -> Value {',
          ]
          if 'fn redact_schedule_value(mut value: Value)' not in source:
              if source.count(marker) != 1:
                  raise SystemExit('admin cron redaction insertion point changed')
              source = source.replace(marker, block(helper_lines), 1)

          old = block([
              '    let mut schedules = schedules_body',
              '        .get("schedules")',
              '        .and_then(Value::as_array)',
              '        .cloned()',
              '        .unwrap_or_default();',
          ])
          new = block([
              '    let mut schedules: Vec<Value> = schedules_body',
              '        .get("schedules")',
              '        .and_then(Value::as_array)',
              '        .into_iter()',
              '        .flatten()',
              '        .cloned()',
              '        .map(redact_schedule_value)',
              '        .collect();',
          ])
          if old in source:
              source = source.replace(old, new, 1)

          source = source.replace(
              '        selected_schedule = body.get("schedule").cloned();\n',
              '        selected_schedule = body.get("schedule").cloned().map(redact_schedule_value);\n',
              1,
          )

          old = block([
              '    for name in ["traceparent", "tracestate"] {',
              '        let header = HeaderName::from_static(name);',
              '        if let Some(value) = incoming.get(&header) {',
              '            headers.insert(header, value.clone());',
              '        }',
              '    }',
          ])
          if old in source:
              source = source.replace(old, '    insert_valid_trace_context(incoming, &mut headers);\n', 1)

          marker = block(['    #[test]', '    fn function_source_and_payloads_are_removed() {'])
          tests = block([
              '    #[test]',
              '    fn outbound_headers_drop_invalid_browser_trace_context() {',
              '        let mut incoming = HeaderMap::new();',
              '        incoming.insert("traceparent", HeaderValue::from_static("00-00000000000000000000000000000000-0123456789abcdef-01"));',
              '        incoming.insert("tracestate", HeaderValue::from_static("vendor=value"));',
              '        let headers = outbound_headers(&service(), "acme", &incoming).unwrap();',
              '        assert!(headers.get("traceparent").is_none());',
              '        assert!(headers.get("tracestate").is_none());',
              '    }',
              '',
              '    #[test]',
              '    fn schedule_destinations_and_payloads_are_redacted() {',
              '        let redacted = redact_schedule_value(json!({"name":"billing","target":{"kind":"webhook","url":"https://secret.example/internal","headers":{"authorization":"secret"},"payload":{"token":"secret"}}}));',
              '        let target = redacted.get("target").and_then(Value::as_object).unwrap();',
              '        assert_eq!(target.get("kind"), Some(&Value::String("webhook".to_string())));',
              '        assert_eq!(target.get("destination_redacted"), Some(&Value::Bool(true)));',
              '        assert!(target.get("url").is_none());',
              '        assert!(target.get("headers").is_none());',
              '        assert!(target.get("payload").is_none());',
              '        let function = redact_schedule_value(json!({"target":{"kind":"function","function_id":Uuid::nil()}}));',
              '        assert_eq!(function.pointer("/target/function_id"), Some(&Value::String(Uuid::nil().to_string())));',
              '    }',
              '',
              '    #[test]',
              '    fn function_source_and_payloads_are_removed() {',
          ])
          if 'fn schedule_destinations_and_payloads_are_redacted()' not in source:
              if source.count(marker) != 1:
                  raise SystemExit('admin cron test insertion point changed')
              source = source.replace(marker, tests, 1)

          required = [
              'fn valid_traceparent(value: &HeaderValue)',
              'fn redact_schedule_value(mut value: Value)',
              '.map(redact_schedule_value)',
              'insert_valid_trace_context(incoming, &mut headers);',
              'fn schedule_destinations_and_payloads_are_redacted()',
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit(f'admin cron hardening incomplete: {missing}')
          path.write_text(source)
          PY
          cargo fmt --all
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
          rm .github/workflows/agent-harden-cron-debugger-v2.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/cron_debug.rs .github/workflows/agent-harden-cron-debugger-v2.yml
          git commit -m 'fix: redact cron destinations and validate trace context'
          git push origin HEAD:agent/cron-admin-debugger
