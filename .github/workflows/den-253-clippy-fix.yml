name: DEN-253 one-shot clippy fix

on:
  push:
    branches:
      - agent/den-253-require-admin-authorization-context
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: den-253-clippy-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mark-test-helper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
          ref: agent/den-253-require-admin-authorization-context
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - name: Mark the boolean assertion helper test-only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/session.rs')
          source = path.read_text()
          old = 'fn authorization_allows_admin(authorization: &AuthorizationContext) -> bool {'
          new = '#[cfg(test)]\nfn authorization_allows_admin(authorization: &AuthorizationContext) -> bool {'
          if new in source:
              raise SystemExit(0)
          if source.count(old) != 1:
              raise SystemExit(f'expected one helper anchor, found {source.count(old)}')
          path.write_text(source.replace(old, new))
          PY
          rustfmt --edition 2021 src/session.rs
          if git diff --quiet -- src/session.rs; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/session.rs
          git commit -m 'DEN-253 mark admin assertion helper test-only'
          git push origin HEAD:agent/den-253-require-admin-authorization-context
