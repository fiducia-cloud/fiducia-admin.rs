name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-den-1379:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/den-1379-shared-auth-cutover' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-1379-shared-auth-cutover
          path: repo
          persist-credentials: true
          submodules: recursive
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: fiducia-cloud/fiducia-interfaces
          ref: 0ad257b6708117dcc3643a9fd15b0f92ca394c1f
          path: fiducia-interfaces
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: fiducia-cloud/fiducia-sync
          ref: e4cb47c9582e11de62c0f19ce3511d3b7c1cce04
          path: fiducia-sync
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - name: Patch startup, login, pins, harness, lockfile and formatting
        working-directory: repo
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path("src/main.rs")
          text = main.read_text()
          old_state = '''    let state = Arc::new(AppState {
        auth_url: required_env("FIDUCIA_AUTH_URL")?,
        brain_url: required_env("FIDUCIA_BRAIN_URL")?,
        supabase_url: required_env("SUPABASE_URL")?,
        supabase_publishable_key: required_env("SUPABASE_PUBLISHABLE_KEY")?,
        db: Some(db),
'''
          new_state = '''    let auth_url = required_env("SHARED_AUTH_URL")?;
    session::initialize(&auth_url).map_err(|error| {
        io::Error::new(
            io::ErrorKind::InvalidInput,
            format!("invalid Shared Auth configuration: {error}"),
        )
    })?;
    let supabase_url = required_env("SUPABASE_URL")?;
    let supabase_publishable_key = required_env("SUPABASE_PUBLISHABLE_KEY")?;

    let state = Arc::new(AppState {
        auth_url,
        brain_url: required_env("FIDUCIA_BRAIN_URL")?,
        supabase_url,
        supabase_publishable_key,
        db: Some(db),
'''
          if old_state not in text:
              raise SystemExit("admin state initialization block did not match")
          text = text.replace(old_state, new_state, 1)

          old_login = '''    let Some(session) = session::from_bearer(&st.auth_url, &password_session.access_token).await
    else {
        return login_page(&st, Some("The identity could not be verified."));
    };
    if !session.is_admin {
        return (StatusCode::FORBIDDEN, views::forbidden(&session, None)).into_response();
    }
    match operator_is_enabled(&st, &session).await {
        Ok(true) => {}
        Ok(false) => {
            return (StatusCode::FORBIDDEN, views::forbidden(&session, None)).into_response()
        }
        Err(error) => return dependency_error("operator_registry_unavailable", error),
    }

    let mut response = redirect("/");
    append_set_cookie(
        &mut response,
        &make_session_cookie(&password_session.access_token),
    );
'''
          new_login = '''    let Some(verified) =
        session::from_bearer(&st.auth_url, &password_session.access_token).await
    else {
        return login_page(
            &st,
            Some("Shared Auth could not authorize this admin identity."),
        );
    };
    let session = verified.session;
    let Some(session_upgrade) = verified.session_upgrade else {
        return dependency_error(
            "shared_auth_session_upgrade_missing",
            "Shared Auth authorized the provider token without issuing a reusable session",
        );
    };
    if !session.is_admin {
        return (StatusCode::FORBIDDEN, views::forbidden(&session, None)).into_response();
    }
    match operator_is_enabled(&st, &session).await {
        Ok(true) => {}
        Ok(false) => {
            return (StatusCode::FORBIDDEN, views::forbidden(&session, None)).into_response()
        }
        Err(error) => return dependency_error("operator_registry_unavailable", error),
    }

    let mut response = redirect("/");
    append_set_cookie(
        &mut response,
        &make_session_cookie(session_upgrade.access_token()),
    );
'''
          if old_login not in text:
              raise SystemExit("admin login verification block did not match")
          text = text.replace(old_login, new_login, 1)
          text = text.replace(
              "//! Auth is a Supabase session (verified through `fiducia-auth`). This is the\n",
              "//! Auth starts at the admin Supabase project and is upgraded through Shared Auth.\n",
              1,
          )
          main.write_text(text)

          harness = Path("tests/admin-browser-harness.mjs")
          htext = harness.read_text()
          old_env = '        FIDUCIA_AUTH_URL: controlPlane.url,\n'
          new_env = '''        SHARED_AUTH_URL: controlPlane.url,
        SHARED_AUTH_ISSUER: "https://auth.fiducia.invalid",
        SHARED_AUTH_AUDIENCE: "fiducia-admin",
        SHARED_AUTH_INTROSPECT_SECRET: TEST_INTERNAL_SECRET,
'''
          if old_env not in htext:
              raise SystemExit("admin browser harness auth env did not match")
          harness.write_text(htext.replace(old_env, new_env, 1))

          old_pin = "6081bc3f3b7cbe0312870968b61acc38ca91c66a"
          new_pin = "0ad257b6708117dcc3643a9fd15b0f92ca394c1f"
          for path in [
              Path("Dockerfile"),
              Path(".github/workflows/ci.yml"),
              Path(".github/workflows/docker.yml"),
              Path("scripts/check-sibling-pins.py"),
          ]:
              if path.exists():
                  path.write_text(path.read_text().replace(old_pin, new_pin))
          leftovers = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              try:
                  if old_pin in path.read_text():
                      leftovers.append(str(path))
              except UnicodeDecodeError:
                  pass
          if leftovers:
              raise SystemExit(f"stale interfaces pin remains in: {leftovers}")
          PY
          cargo generate-lockfile
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock Dockerfile .github/workflows scripts src tests
          git commit -m "feat(auth): complete admin Shared Auth cutover"
          git push origin HEAD:agent/den-1379-shared-auth-cutover

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: repo
          submodules: recursive
      - name: Validate GitHub Actions
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: repo/.github/workflows/ci.yml repo/.github/workflows/docker.yml
      - name: Sibling dependency pins stay synchronized
        working-directory: repo
        run: python3 scripts/check-sibling-pins.py
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-interfaces
          ref: 6081bc3f3b7cbe0312870968b61acc38ca91c66a
          path: fiducia-interfaces
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-sync
          ref: e4cb47c9582e11de62c0f19ce3511d3b7c1cce04
          path: fiducia-sync
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: repo
      - name: CLI flag contract
        working-directory: repo
        run: |
          make -B -C vendor/flags-2-env all
          vendor/flags-2-env/build/flags2env audit .cli-flags.toml
      - name: fmt
        working-directory: repo
        run: cargo fmt --all --check
      - name: clippy
        working-directory: repo
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: test
        working-directory: repo
        run: cargo test --locked --all-targets --all-features
      - uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2
        with:
          tool: cargo-audit@0.22.2
      - name: audit
        working-directory: repo
        run: cargo audit

  browser-e2e:
    name: browser e2e (Playwright + Puppeteer)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fiducia_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fiducia_admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/fiducia_admin
      CHROME_BIN: /usr/bin/google-chrome
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: repo
          submodules: recursive
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-interfaces
          ref: 6081bc3f3b7cbe0312870968b61acc38ca91c66a
          path: fiducia-interfaces
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-sync
          ref: e4cb47c9582e11de62c0f19ce3511d3b7c1cce04
          path: fiducia-sync
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-test-config
          ref: 026fcf28193c7baeb7f5feb68480a91539c1f0fa
          path: fiducia-test-config
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: repo
      - name: Apply canonical admin schema
        run: psql "$DATABASE_URL" --set ON_ERROR_STOP=1 --file fiducia-interfaces/sql/admin.sql
      - name: Install browser test dependencies without install scripts
        working-directory: repo
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify browser prerequisite
        run: |
          test -x "$CHROME_BIN"
          "$CHROME_BIN" --version
          node --version
          npm --version
      - name: Run real-browser admin journeys
        working-directory: repo
        run: npm run test:browser

  container-build:
    name: production container graph
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Sibling dependency pins stay synchronized
        run: python3 scripts/check-sibling-pins.py
      - name: Build the non-publishing production image
        run: |
          docker build \
            --build-arg INTERFACES_REF=6081bc3f3b7cbe0312870968b61acc38ca91c66a \
            --build-arg SYNC_REF=e4cb47c9582e11de62c0f19ce3511d3b7c1cce04 \
            --tag fiducia-admin:pr .
