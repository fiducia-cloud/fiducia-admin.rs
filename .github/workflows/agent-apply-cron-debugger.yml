name: apply operator cron debugger source

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/cron-admin-debugger' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/cron-admin-debugger
          fetch-depth: 0
          show-progress: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - name: Integrate and format debugger
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-cron-debugger.py
          cargo fmt --all
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/cron_debug.rs src/main.rs src/views.rs
          git commit -m 'feat: add operator-only cron debugger'
          git push origin HEAD:agent/cron-admin-debugger
