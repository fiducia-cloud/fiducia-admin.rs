name: diagnose admin cron Clippy

on:
  push:
    branches:
      - agent/cron-admin-debugger

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: repo
          submodules: recursive
          show-progress: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-interfaces
          ref: 2c5c806174e067fbe83ad48b724366323ba390a2
          path: fiducia-interfaces
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-sync
          ref: 6de4f016769960023f8e5a7cfb8a989d7fb2b302
          path: fiducia-sync
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.95.0"
          components: clippy
      - name: Capture strict Clippy output
        working-directory: repo
        shell: bash
        run: |
          set +e
          cargo clippy --locked --all-targets --all-features -- -D warnings > /tmp/admin-cron-clippy.log 2>&1
          status=$?
          echo "$status" > /tmp/admin-cron-clippy.status
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: admin-cron-clippy-${{ github.run_id }}
          path: |
            /tmp/admin-cron-clippy.log
            /tmp/admin-cron-clippy.status
          if-no-files-found: error
