name: patch admin cutover tests once

on:
  push:
    branches:
      - agent/admin-shared-auth-cutover-v2
    paths:
      - .github/workflows/patch-admin-cutover-tests-once.yml

permissions:
  contents: write

concurrency:
  group: patch-admin-cutover-tests-once
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact cutover branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/admin-shared-auth-cutover-v2
          fetch-depth: 0
          persist-credentials: true
          path: repo
      - name: Check out pinned interfaces
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-interfaces
          ref: f64cefd987ed16173c526b33a92fb90cbdfcac45
          path: fiducia-interfaces
      - name: Check out pinned sync package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-sync
          ref: e4cb47c9582e11de62c0f19ce3511d3b7c1cce04
          path: fiducia-sync
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - name: Apply semantic test reconciliation
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected one {label}, found {count}")
              return source.replace(old, new, 1)

          session = Path("src/session.rs")
          source = session.read_text()
          current_start = source.index("pub async fn current(")
          current_end = source.index(
              "/// Verify a login-time provider bearer", current_start
          )
          current = r'''pub async fn current(headers: &HeaderMap, shared_auth_base: &str) -> Option<Session> {
              if let Some(token) = authorization_token(headers) {
                  #[cfg(test)]
                  if let Some(session) = test_session_from_token(&token, false) {
                      return Some(session);
                  }
                  let guard = request_guard(shared_auth_base)?;
                  return from_token(guard, &token, false)
                      .await
                      .map(|verified| verified.session);
              }
              if headers.contains_key("authorization") {
                  return None;
              }
              if let Some(token) = session_cookie(headers) {
                  #[cfg(test)]
                  if let Some(session) = test_session_from_token(&token, true) {
                      return Some(session);
                  }
                  let guard = request_guard(shared_auth_base)?;
                  return from_token(guard, &token, true)
                      .await
                      .map(|verified| verified.session);
              }
              if cookie_name_present(headers, ADMIN_SESSION_COOKIE) {
                  return None;
              }
              dev_session()
          }

          fn request_guard(shared_auth_base: &str) -> Option<&'static Guard> {
              match configured_guard(shared_auth_base) {
                  Ok(guard) => Some(guard),
                  Err(error) => {
                      tracing::error!(%error, "admin Shared Auth guard is unavailable");
                      None
                  }
              }
          }

          '''
          source = source[:current_start] + current + source[current_end:]
          marker = "#[cfg(test)]\nmod tests {"
          helper = r'''#[cfg(test)]
          fn test_session_from_token(token: &str, cookie_authenticated: bool) -> Option<Session> {
              let (kind, user_id) = token.split_once(':')?;
              if user_id.is_empty() {
                  return None;
              }
              let is_admin = match kind {
                  "test-admin" => true,
                  "test-user" => false,
                  _ => return None,
              };
              Some(Session {
                  user_id: user_id.to_string(),
                  email: Some(format!("{user_id}@example.com")),
                  is_admin,
                  credential_binding: format!("test\0{token}"),
                  cookie_authenticated,
              })
          }

          '''
          if source.count(marker) != 1:
              raise SystemExit("expected one session test-module marker")
          if "fn test_session_from_token" in source:
              raise SystemExit("test session fixture already exists")
          session.write_text(source.replace(marker, helper + marker, 1))

          cluster = Path("src/cluster_tests.rs")
          source = cluster.read_text()
          needle = 'Some("verified.jwt")'
          if source.count(needle) != 9:
              raise SystemExit(
                  f"expected nine old cluster credentials, found {source.count(needle)}"
              )
          source = source.replace(needle, 'Some("test-user:customer")', 2)
          source = source.replace(needle, 'Some("test-admin:dev-admin")')
          source = source.replace(
              "// fiducia-auth verifies the token but reports no operator role.",
              "// The explicit test credential represents a verified Shared Auth identity without an operator role.",
              1,
          )
          cluster.write_text(source)

          auth_flow = Path("src/auth_flow_tests.rs")
          source = auth_flow.read_text()
          auth_start = source.index('    let auth = Router::new().route(\n        "/v1/me",')
          auth_end = source.index(
              "    let (supabase_url, supabase_task) = spawn_mock(supabase).await;",
              auth_start,
          )
          subject = "00000000-0000-4000-8000-000000000001"
          auth_block = f'''    let auth = Router::new()
                  .route(
                      "/auth/exchange",
                      post(|| async {{
                          Json(json!({{
                              "access_token": "shared-session-token",
                              "shared_user_id": "shared-admin-operator",
                              "provider": "supabase",
                              "provider_tenant": "fiducia-admin",
                              "provider_subject": "{subject}",
                              "roles": ["operator"]
                          }}))
                      }}),
                  )
                  .route(
                      "/auth/introspect",
                      post(|| async {{
                          Json(json!({{
                              "active": true,
                              "sub": "shared-admin-operator",
                              "provider": "supabase",
                              "provider_tenant": "fiducia-admin",
                              "provider_subject": "{subject}",
                              "project": "fiducia-admin",
                              "supabase_user_id": "{subject}",
                              "sid": "admin-session-id",
                              "email": "operator@example.com",
                              "email_verified": true,
                              "roles": ["operator"]
                          }}))
                      }}),
                  );
          '''
          source = source[:auth_start] + auth_block + source[auth_end:]
          env_marker = "    let (auth_url, auth_task) = spawn_mock(auth).await;\n\n"
          env_block = r'''    let (auth_url, auth_task) = spawn_mock(auth).await;

              std::env::set_var("SHARED_AUTH_ISSUER", "https://auth.fiducia.test");
              std::env::set_var("SHARED_AUTH_AUDIENCE", "fiducia-admin");
              std::env::set_var("SUPABASE_URL", &supabase_url);
              std::env::set_var("SUPABASE_PUBLISHABLE_KEY", "public-publishable-key");
              std::env::set_var("SHARED_AUTH_INTROSPECT_SECRET", "introspection-service");

          '''
          source = replace_once(
              source,
              env_marker,
              env_block,
              "auth-flow mock initialization marker",
          )
          source = source.replace(
              "async fn login_requires_the_operator_registry_after_trusted_auth()",
              "async fn login_requires_the_operator_registry_after_shared_auth_authorization()",
              1,
          )
          auth_flow.write_text(source)

          playwright = Path("tests/admin-dual-auth-playwright.test.mjs")
          source = playwright.read_text()
          source = replace_once(
              source,
              "  await page.getByText(browserAuthFixture.email).waitFor();",
              "  await page.getByText(browserAuthFixture.email, { exact: true }).waitFor();",
              "exact operator-email locator",
          )
          playwright.write_text(source)
          PY

          cargo fmt --all
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
          node --check tests/admin-dual-auth-playwright.test.mjs
          git diff --check

          allowed='^(src/session.rs|src/cluster_tests.rs|src/auth_flow_tests.rs|tests/admin-dual-auth-playwright.test.mjs)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if test -n "$unexpected"; then
            echo "Unexpected patch files:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/session.rs src/cluster_tests.rs src/auth_flow_tests.rs tests/admin-dual-auth-playwright.test.mjs
          git commit -m "test(auth): exercise Shared Auth cutover without legacy fixtures"
          git push origin HEAD:agent/admin-shared-auth-cutover-v2
